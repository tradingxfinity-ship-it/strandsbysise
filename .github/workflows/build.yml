# Regenerates the HTML whenever content or templates change.
#
# The admin panel commits data/*.json; without this, those edits would sit
# in the repo without ever reaching a page. Vercel only serves files — it
# does not run build.py — so the built HTML is committed here instead.
#
# Deliberately does NOT change how Vercel deploys: if this workflow ever
# fails, the site keeps serving the last good HTML rather than going down.
#
# The `concurrency` group below collapses a burst of quick saves into ONE
# rebuild: when several content commits land in a row, only the newest run
# finishes and the older in-flight ones are cancelled. That means one
# rebuild commit — and so one Vercel deploy — for a flurry of edits, instead
# of one per save. It pairs with the Vercel "Ignored Build Step" (see
# README) that skips deploying the raw data commits themselves.
name: Build site

on:
  push:
    branches: [main]
    # Note the absence of '*.html': this workflow commits those, and
    # listing them here would make it re-trigger itself forever.
    paths:
      - 'data/**'
      - 'templates/**'
      - 'assets/css/**'
      - 'assets/js/**'
      - 'build.py'
  workflow_dispatch:

# One rebuild at a time; a newer content push cancels an older, still-running
# rebuild so a run of quick edits produces a single deploy, not a pile.
concurrency:
  group: build-site
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild pages
        run: python3 build.py

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- '*.html'; then
            echo "No page changes — nothing to commit."
            exit 0
          fi
          git add -- '*.html'
          git commit -m "Rebuild pages from content changes"
          # A content commit may have landed while we were building; rebase
          # onto it and retry rather than failing the push.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing on latest and retrying."
            git pull --rebase --autostash origin main || true
          done
          echo "Could not push after retries; the next content change will rebuild."
          exit 1
