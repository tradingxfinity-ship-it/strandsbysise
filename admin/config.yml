# StrandsBySise admin panel — what Sise can edit and how it's presented.
#
# Everything here maps onto the files in data/. Saving commits to GitHub,
# which triggers the Build site workflow, which regenerates the pages.

backend:
  name: github
  repo: tradingxfinity-ship-it/strandsbysise
  branch: main
  # The sign-in handler lives with the site — see api/auth.js.
  base_url: https://strandsbysise.vercel.app
  auth_endpoint: api/auth
  commit_messages:
    create: 'Add {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Remove {{collection}} "{{slug}}"'
    uploadMedia: 'Upload {{path}}'
    deleteMedia: 'Remove {{path}}'

# Photos uploaded through the panel land where the site already looks for them.
media_folder: assets/img
public_folder: /assets/img

# Save shows a live preview link rather than a confusing "publish" workflow.
publish_mode: simple
site_url: https://strandsbysise.vercel.app
# Sise's brand on the login screen rather than the CMS vendor's. A wordmark,
# not a photo — a photo fills the whole screen and reads as a mistake.
logo_url: https://strandsbysise.vercel.app/assets/img/admin-logo.svg

collections:
  # ---------------------------------------------------------------- products
  # A folder collection, one file per product. This is what gives the panel a
  # real "New Product" button — as a single file holding a list, adding a
  # product meant scrolling to the bottom of one very long form, which nobody
  # would find.
  - name: products
    label: Products
    label_singular: Product
    folder: data/products
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{fields.id}}'
    summary: '{{name}} — ₦{{price}}'
    sortable_fields: [order, name, price]
    description: >-
      Every piece in the shop. Press + Product to add one; each needs a name,
      a photo and a price.
    fields:
      - name: name
        label: Product name
        widget: string
        hint: What shoppers see, e.g. Silk Straight.

      - name: image
        label: Photo
        widget: image
        hint: >-
          The photo shown on the shop and home page. Upload a new one or pick
          an existing one — no need to name the file anything in particular.

      - name: id
        label: Short ID
        widget: string
        pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only — no spaces']
        hint: >-
          Lowercase and hyphenated, e.g. silk-straight. This names the photo
          files, so try not to change it once photos are uploaded.

      - name: order
        label: Position in the shop
        widget: number
        value_type: int
        default: 100
        hint: Lower numbers come first. The first four also fill Best Sellers.

      - name: cat
        label: Collection
        widget: select
        options: [wavy, bouncy, bonestraight, deepwave, pixie-curls]

      - name: price
        label: Price (₦)
        widget: number
        value_type: int
        min: 0
        hint: Numbers only — no commas or ₦ sign.

      - name: old
        label: Was price (₦)
        widget: number
        value_type: int
        required: false
        hint: Shows crossed out beside the price. Leave empty if not on offer.

      - { name: length, label: Length, widget: string, hint: 'e.g. 20"' }
      - { name: texture, label: Texture, widget: string, hint: 'e.g. Bonestraight' }
      - { name: density, label: Weight (g), widget: string, hint: "The wig's weight in grams, e.g. 320" }

      - name: closure
        label: Closure type
        widget: select
        required: false
        options: ['5 by 5', '6 by 6', '9 by 6', '13 by 4', '13 by 6', 'Custom unit']
        hint: >-
          The lace closure or frontal size. Pick Custom unit for a
          made-to-order piece. Leave empty to hide it on the product.

      - name: weight_kg
        label: Shipping weight (kg)
        widget: number
        value_type: float
        min: 0.1
        step: 0.05
        default: 0.4
        hint: >-
          Boxed weight of this piece. Used to price international delivery,
          so an under-estimate costs you money on every overseas order.

      - name: tag
        label: Badge
        widget: select
        required: false
        options: ['Best Seller', 'New In', 'Sale', "Editor's Pick", 'Signature']
        hint: The small label on the card. Leave empty for none.

      - name: tag_dark
        label: Dark badge
        widget: boolean
        default: false
        required: false
        hint: Charcoal badge instead of white. Suits New In and Signature.

      - name: rating
        label: Rating out of 5
        widget: number
        value_type: float
        min: 0
        max: 5
        step: 0.1
        default: 4.9

      - name: reviews
        label: Number of reviews
        widget: number
        value_type: int
        min: 0
        default: 0

  # ---------------------------------------------------------------- settings
  - name: settings
    label: Settings
    files:
      - name: contact
        label: Contact & links
        file: data/settings.json
        description: >-
          Used across every page. Changing the WhatsApp number here updates
          the header, the footer, the contact page and every order button.
        fields:
          - name: owner_name
            label: Your first name
            widget: string
            hint: Used to greet you at the top of this panel.

          - name: announcement
            label: Announcement bar
            widget: string
            hint: >-
              The strip at the very top. Any ₦ amount is emphasised
              automatically — just write it as normal text.
          - { name: phone_display, label: Phone (as shown), widget: string }
          - name: phone_link
            label: Phone (for dialling)
            widget: string
            hint: Same number, no spaces, with country code — e.g. +2348030000000
          - name: whatsapp_number
            label: WhatsApp number
            widget: string
            hint: >-
              Digits only, country code first, no + or spaces — e.g.
              2348030000000. Powers every WhatsApp button on the site.
          - name: hair_bank_group_url
            label: Hair Bank group invite link
            widget: string
            hint: >-
              WhatsApp → the group → Group info → Invite via link → Copy link.
          - { name: email, label: Email, widget: string }
          - { name: instagram_url, label: Instagram, widget: string }
          - { name: tiktok_url, label: TikTok, widget: string }
          - { name: facebook_url, label: Facebook, widget: string }
          - { name: opening_hours_short, label: Opening hours (short), widget: string }
